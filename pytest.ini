[pytest]
testpaths = tests
# Put the repo root on sys.path so `import app` resolves. `python -m pytest`
# adds the CWD for you, but a bare `pytest` (what CI runs) does not — without
# this, conftest fails to import app.* and the run dies at collection.
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -q
filterwarnings =
    # pytest-asyncio's event-loop-policy shim is noisy on Python 3.14. Prod
    # runs 3.13 (see Dockerfile); this only affects local runs.
    ignore:'asyncio\.[gs]et_event_loop_policy' is deprecated:DeprecationWarning
